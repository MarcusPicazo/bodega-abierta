# Local SQL Server for Bodega Abierta.
# Host port 1434 (not 1433) so it can run next to other SQL Server containers on this machine.
# Usage: copy .env.example to .env, set MSSQL_SA_PASSWORD, then `docker compose up -d`.
name: bodega-abierta

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bodega-abierta-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "1434:1433"
    volumes:
      - bodega-abierta-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  bodega-abierta-sql-data:
